<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Babi 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff7eb3;--deep:#e0457b;--ink:#7a2a4d;--soft:#ffe0ee}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito','Trebuchet MS',sans-serif;font-weight:600;color:var(--ink);background:linear-gradient(160deg,#fff5f9,#ffd6e7,#ffc2da,#fff0f5);background-size:300% 300%;animation:bg 14s ease infinite;overflow:hidden;display:flex;align-items:center;justify-content:center}
@keyframes bg{50%{background-position:100% 100%}}
#petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-30px;background:radial-gradient(circle at 30% 30%,#fff,#ffb3d1 60%,#ff8fbd);border-radius:150% 0 150% 0;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.fh{position:absolute;bottom:-40px;opacity:.5;animation:rise linear infinite}
@keyframes rise{to{transform:translate(var(--dx),-110vh) rotate(30deg)}}
#app{position:relative;z-index:1;width:min(92vw,470px);max-height:96vh;overflow:auto;text-align:center;padding:28px 20px;background:rgba(255,255,255,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:32px;box-shadow:0 20px 60px rgba(224,69,123,.28),0 0 0 3px rgba(255,255,255,.8),0 0 40px rgba(255,126,179,.35);animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
h1,h2{font-family:'Dancing Script','Brush Script MT',cursive;color:var(--deep);margin-bottom:6px;text-shadow:0 3px 14px rgba(255,126,179,.45)}
h1{font-size:3rem;line-height:1}h2{font-size:2.2rem}
p{margin:6px 0 14px;line-height:1.55}
.btn{font:inherit;font-weight:800;border:0;cursor:pointer;color:#fff;padding:13px 32px;border-radius:99px;background:linear-gradient(135deg,#ffa8cf,var(--deep));box-shadow:0 8px 22px rgba(224,69,123,.45);transition:.2s;margin:6px;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3s infinite}
@keyframes shine{60%,100%{left:140%}}
.btn:hover{transform:translateY(-3px) scale(1.05)}.btn:active{transform:scale(.95)}
.bar{display:flex;gap:7px;justify-content:center;margin-bottom:14px}
.dot{width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px #ffb3d1;transition:.4s}
.dot.on{background:var(--pink);box-shadow:0 0 12px var(--pink);transform:scale(1.25)}
.fade{animation:fade .7s ease}
@keyframes fade{from{opacity:0;transform:translateY(16px)}}
.big{font-size:4.2rem;display:inline-block;animation:beat 1.2s infinite;filter:drop-shadow(0 6px 12px rgba(224,69,123,.4))}
@keyframes beat{30%{transform:scale(1.2)}60%{transform:scale(1)}}
/* loader */
#load{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#fff5f9,#ffc2da);transition:opacity .9s,transform .9s}
#load.out{opacity:0;transform:scale(1.15);pointer-events:none}
.lh{position:relative;width:130px;height:120px;animation:beat 1.4s infinite}
.lh svg{width:100%;height:100%;filter:drop-shadow(0 8px 18px rgba(224,69,123,.5))}
#lname{font-family:'Dancing Script',cursive;font-size:2.8rem;color:var(--deep);margin-top:14px;text-shadow:0 3px 14px rgba(255,126,179,.5)}
#lmsg{margin-top:6px;min-height:1.5em;color:var(--ink);transition:opacity .3s}
#lpct{font-weight:800;color:var(--deep);margin-top:8px}
.lbar{width:210px;height:10px;border-radius:99px;background:#fff;margin-top:10px;overflow:hidden;box-shadow:inset 0 0 0 2px #ffc2da}
.lbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffb3d1,var(--deep))}
/* memory */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.card{aspect-ratio:1;perspective:600px;cursor:pointer}
.card div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip div{transform:rotateY(180deg)}
.card span{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border-radius:16px;font-size:1.8rem}
.card .f{background:linear-gradient(135deg,#ffb3d1,#ff7eb3);color:#fff;box-shadow:0 6px 14px rgba(224,69,123,.3)}
.card .b{background:#fff;transform:rotateY(180deg);box-shadow:0 6px 14px rgba(224,69,123,.2)}
.card.done .b{background:var(--soft);animation:beat .6s}
#arena{position:relative;height:300px;background:linear-gradient(#fff,#ffe3ef);border-radius:22px;overflow:hidden;margin:10px 0;touch-action:none;box-shadow:inset 0 0 0 2px #ffc2da}
.basket{position:absolute;bottom:6px;font-size:2.6rem;transform:translateX(-50%);transition:left .06s}
.fall{position:absolute;font-size:1.8rem;top:-40px}
.pop{position:absolute;font-size:2.3rem;cursor:pointer;animation:float 3s ease-in forwards;user-select:none}
@keyframes float{to{transform:translateY(-330px) rotate(25deg);opacity:.2}}
.burst{position:fixed;pointer-events:none;font-size:1.2rem;z-index:60;animation:burst .8s forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.spark{position:fixed;pointer-events:none;z-index:60;font-size:.9rem;animation:sp .8s forwards}
@keyframes sp{to{transform:translateY(24px) scale(.2);opacity:0}}
.opts{display:grid;gap:9px;margin:10px 0}
.opt{font:inherit;font-weight:800;padding:13px;border:0;border-radius:18px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 4px 12px rgba(224,69,123,.2);transition:.2s}
.opt:hover{background:var(--soft);transform:scale(1.03)}
.opt.ok{background:linear-gradient(135deg,#ffb3d1,var(--pink));color:#fff}.opt.no{animation:shake .4s;background:#ffe0e0}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.note{min-height:3em;color:var(--deep);font-weight:800}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;min-height:52px}
.tile{width:46px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;background:#fff;box-shadow:0 4px 10px rgba(224,69,123,.25);cursor:pointer;transition:.2s}
.tile:hover{transform:translateY(-4px)}.tile.slot{background:#ffd6e7;color:var(--deep)}
.env{position:relative;width:250px;height:165px;margin:22px auto;cursor:pointer;animation:bob 2.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.env .body{position:absolute;inset:0;background:linear-gradient(#ffb3d1,#ff8fbd);border-radius:12px;box-shadow:0 12px 30px rgba(224,69,123,.45)}
.env .flap{position:absolute;top:0;left:0;width:100%;height:95px;background:#ff9ac4;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:3}
.env .heart{position:absolute;top:62px;left:50%;transform:translateX(-50%);font-size:2.2rem;z-index:4;transition:.5s;animation:beat 1.2s infinite}
.env.open{animation:none}.env.open .flap{transform:rotateX(180deg);z-index:0}.env.open .heart{opacity:0}
.letter{text-align:left;background:linear-gradient(#fffafc,#fff0f6);border-radius:20px;padding:24px;margin-top:10px;box-shadow:0 10px 30px rgba(224,69,123,.25),inset 0 0 0 2px #ffd0e3;white-space:pre-wrap;line-height:1.55;font-family:'Dancing Script','Brush Script MT',cursive;font-size:1.5rem;font-weight:600;color:var(--ink);max-height:50vh;overflow:auto;animation:fade 1s}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px auto;max-width:300px}
.pad{aspect-ratio:1;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:3rem;cursor:pointer;background:linear-gradient(135deg,#fff,#ffd6e7);box-shadow:0 6px 16px rgba(224,69,123,.25);transition:.2s;user-select:none}
.pad.lit{background:linear-gradient(135deg,#ffb3d1,var(--deep));transform:scale(1.08);box-shadow:0 0 30px var(--pink)}
.cups{position:relative;height:120px;margin:44px 0 14px}
.cup{position:absolute;bottom:0;width:30%;height:90px;transition:left .4s cubic-bezier(.5,0,.3,1);cursor:pointer}
.cup .lid{position:absolute;inset:0;border-radius:24px 24px 10px 10px;background:linear-gradient(160deg,#ffb3d1,var(--deep));box-shadow:0 8px 18px rgba(224,69,123,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.8rem;transition:transform .4s;z-index:2}
.cup.up .lid{transform:translateY(-62px)}
.cup .hh{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:2.2rem;opacity:0;z-index:1}
.cup.up .hh{opacity:1}
.scr{position:relative;width:300px;max-width:100%;height:160px;margin:12px auto;border-radius:20px;overflow:hidden;box-shadow:0 8px 20px rgba(224,69,123,.3)}
.scr .under{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff5f9;color:var(--deep);font-family:'Dancing Script',cursive;font-size:1.8rem;line-height:1.2}
.scr .under small{font-family:'Nunito',sans-serif;font-size:.75rem;margin-top:6px;color:var(--ink)}
.scr canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .8s}
.seal{--p:0;position:absolute;top:50px;left:calc(50% - 39px);width:78px;height:78px;border-radius:50%;z-index:4;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--deep) calc(var(--p)*1%),#fff 0);box-shadow:0 0 24px rgba(255,255,255,.9),0 6px 16px rgba(224,69,123,.5);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;transition:opacity .5s;animation:beat 1.3s infinite}
.seal span{width:62px;height:62px;border-radius:50%;background:#ffe0ee;display:flex;align-items:center;justify-content:center;font-size:2rem;pointer-events:none}
.env.hold{animation:tremble .12s infinite}
@keyframes tremble{25%{transform:translate(-2px,1px) rotate(-1deg)}75%{transform:translate(2px,-1px) rotate(1deg)}}
.env.open .seal{opacity:0;animation:none}
.small{font-size:.85rem;opacity:.8}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="petals"></div>
<div id="app"></div>

<div id="load">
  <div class="lh">
    <svg viewBox="0 0 100 92">
      <defs>
        <linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#e0457b"/><stop offset="100%" stop-color="#ffb3d1"/></linearGradient>
        <clipPath id="c"><rect id="fill" x="0" y="92" width="100" height="92"/></clipPath>
      </defs>
      <path id="hp" d="M50 88C20 62 4 45 4 27 4 14 14 5 26 5c10 0 20 6 24 15C54 11 64 5 74 5c12 0 22 9 22 22 0 18-16 35-46 61z" fill="#fff" stroke="#ffb3d1" stroke-width="3"/>
      <path d="M50 88C20 62 4 45 4 27 4 14 14 5 26 5c10 0 20 6 24 15C54 11 64 5 74 5c12 0 22 9 22 22 0 18-16 35-46 61z" fill="url(#g)" clip-path="url(#c)"/>
    </svg>
  </div>
  <div id="lname">Babi</div>
  <div id="lmsg">Waking up my favorite person…</div>
  <div class="lbar"><i id="lb"></i></div>
  <div id="lpct">0%</div>
</div>

<script>
const HER_NAME = "Hi babi ko";
const CALLSIGN = "Babi!";
const YOUR_NAME = "Eli";
const MEMORY_EMOJIS = ["🌸","💖","🧸","🍓"];
const SECRET_WORD = "HAPPY";
const LOAD_MSGS = [
  "Waking up my favorite person…",
  "Gathering petals for My Eri…",
  "Wrapping my infinite lovelove for my Babi…",
  "Adding extra sparkles ✨",
  "Almost there, Babi ko! "
];
const QUIZ = [
  {q:"Who fell in love first? ", a:["Me 😏","You","We both did at the same time"], c:0,
   ok:"Ginayuma talaga kita kaya ka na-inlove", no:"Ano, nag mamadali?"},
  {q:"But who fell HARDER?", a:["Me","It's a tie","You 😌"], c:2,
   ok:"Yes babi ko, you fell first but I fell harder, penge kiss, oki?", no:"Wrong answer, Babi… try again 🥹"},
  {q:"Anong favorite ko na tawag sayo?", a:["My Babi 🌸","Eri","Baby"], c:0,
   ok:"Babi, my Babi!", no:"Alam mo yan! I mean favorite naman lahat pero isa lang!"}
];
const LETTER = `My dearest Eri, my Babi,

Hi baby! I hope nagustuhan mo yung palaro ko and medyo na-iba naman ngayon para medyo may fun naman HAHAHAHAHAHAH

anyways, I love you so much my dear babi babi ko! thank you for making me smile and happy baby, also for cheering me up palagi, you really have your ways to make me laugh, 

you don't know how much it means and how grateful I am to have you by my side, thank you for always making me feel loved and appreciated my sweet-loving baby ko!

Thank you so much rin for understanding and handling me with so much patience and care, I feel the happiest and the safest palagi when I am with you, 
sobrang-sobrang thankful ako palagi for you, my pahinga, I love you so muchie super-duper dami!

Forever yours,
${YOUR_NAME} 💖`;
/* ==================================== */

const app = document.getElementById('app');
const total = 8; let stage = 0;
const $ = h => {app.innerHTML = h; app.scrollTop = 0};
const bar = () => `<div class="bar">${Array.from({length:total},(_,i)=>`<div class="dot ${i<=stage?'on':''}"></div>`).join('')}</div>`;

/* ambient petals + floating hearts */
const pl = document.getElementById('petals');
function petal(){
  const p=document.createElement('div');p.className='petal';
  const s=8+Math.random()*14;
  p.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s*1.3}px;--dx:${(Math.random()-.5)*200}px;animation-duration:${6+Math.random()*7}s`;
  pl.appendChild(p);setTimeout(()=>p.remove(),13000);
}
function floatHeart(){
  const h=document.createElement('div');h.className='fh';h.textContent=['💗','💕','🌸'][Math.floor(Math.random()*3)];
  h.style.cssText=`left:${Math.random()*100}vw;font-size:${14+Math.random()*16}px;--dx:${(Math.random()-.5)*120}px;animation-duration:${9+Math.random()*6}s`;
  pl.appendChild(h);setTimeout(()=>h.remove(),15000);
}
setInterval(petal,350);setInterval(floatHeart,1500);
for(let i=0;i<14;i++)setTimeout(petal,i*120);

/* sparkle trail */
let last=0;
addEventListener('pointermove',e=>{
  const n=Date.now();if(n-last<60)return;last=n;
  const s=document.createElement('div');s.className='spark';s.textContent=['✨','💗','🌸'][Math.floor(Math.random()*3)];
  s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),800);
});

function burst(x,y,em='💗',n=8){
  for(let i=0;i<n;i++){
    const b=document.createElement('div');b.className='burst';b.textContent=em;
    b.style.cssText=`left:${x}px;top:${y}px;--x:${(Math.random()-.5)*170}px;--y:${(Math.random()-.5)*170}px`;
    document.body.appendChild(b);setTimeout(()=>b.remove(),800);
  }
}
const next = () => {stage++;setTimeout(games[stage],800)};

/* loading screen */
(function(){
  const f=document.getElementById('fill'),lb=document.getElementById('lb'),pc=document.getElementById('lpct'),lm=document.getElementById('lmsg'),ld=document.getElementById('load');
  let p=0,mi=0;
  const mt=setInterval(()=>{mi=(mi+1)%LOAD_MSGS.length;lm.style.opacity=0;setTimeout(()=>{lm.textContent=LOAD_MSGS[mi];lm.style.opacity=1},250)},900);
  const t=setInterval(()=>{
    p=Math.min(100,p+Math.random()*5+1.5);
    f.setAttribute('y',92-92*p/100);lb.style.width=p+'%';pc.textContent=Math.floor(p)+'%';
    if(p>=100){clearInterval(t);clearInterval(mt);lm.textContent="Ready, Babi 💖";setTimeout(()=>{ld.classList.add('out');setTimeout(()=>ld.remove(),1000);intro()},700)}
  },90);
})();

/* intro */
function intro(){
  $(`<div class="fade"><div class="big">💗</div><h1>Hi, ${CALLSIGN}</h1>
  <p>${HER_NAME}, I made something just for you! <br>kaunting palaro lang and a little letter na naghihintay sa huli, muehehehe!</p>
  <button class="btn" id="go">Start 🌸</button></div>`);
  document.getElementById('go').onclick=e=>{burst(e.clientX,e.clientY,'🌸');games[0]()};
}

/* 1 memory */
function g1(){
  const deck=[...MEMORY_EMOJIS,...MEMORY_EMOJIS].sort(()=>Math.random()-.5);
  $(`<div class="fade">${bar()}<h2>Memory Match</h2><p>Find all the pairs, Babi!</p>
  <div class="grid">${deck.map(e=>`<div class="card" data-e="${e}"><div><span class="f">💗</span><span class="b">${e}</span></div></div>`).join('')}</div></div>`);
  let open=[],lock=false,done=0;
  document.querySelectorAll('.card').forEach(c=>c.onclick=ev=>{
    if(lock||c.classList.contains('flip'))return;
    c.classList.add('flip');open.push(c);
    if(open.length===2){
      lock=true;const[a,b]=open;
      if(a.dataset.e===b.dataset.e){
        a.classList.add('done');b.classList.add('done');burst(ev.clientX,ev.clientY);
        open=[];lock=false;done++;if(done===MEMORY_EMOJIS.length)next();
      }else setTimeout(()=>{a.classList.remove('flip');b.classList.remove('flip');open=[];lock=false},800);
    }
  });
}

/* 2 catch petals */
function g2(){
  $(`<div class="fade">${bar()}<h2>Catch the Petals po, babi! </h2><p>Slide to catch 10 🌸 and dodge mo yung 💔</p>
  <div id="arena"><div class="basket" id="bk" style="left:50%">🧺</div></div><p id="sc">0 / 10</p></div>`);
  const ar=document.getElementById('arena'),bk=document.getElementById('bk'),sc=document.getElementById('sc');
  let score=0,alive=true,x=50;
  const move=e=>{const r=ar.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;x=Math.max(8,Math.min(92,cx/r.width*100));bk.style.left=x+'%'};
  ar.addEventListener('mousemove',move);ar.addEventListener('touchmove',move);ar.addEventListener('touchstart',move);
  const spawn=()=>{
    if(!alive)return;
    const f=document.createElement('div');f.className='fall';const bad=Math.random()<.2;
    f.textContent=bad?'💔':['🌸','💮','🌷'][Math.floor(Math.random()*3)];
    const lx=8+Math.random()*84;f.style.left=lx+'%';ar.appendChild(f);
    let y=-40;const sp=2+Math.random()*1.5;
    const t=setInterval(()=>{
      y+=sp;f.style.top=y+'px';
      if(y>240&&y<290&&Math.abs(lx-x)<12){
        clearInterval(t);f.remove();
        if(bad){score=Math.max(0,score-1)}else{score++;const r=bk.getBoundingClientRect();burst(r.left+20,r.top)}
        sc.textContent=score+' / 10';
        if(score>=10&&alive){alive=false;next()}
      }else if(y>310){clearInterval(t);f.remove()}
    },16);
    setTimeout(spawn,600);
  };spawn();
}

/* 3 pop hearts */
function g3(){
  $(`<div class="fade">${bar()}<h2>Pop My Hearts</h2><p>Tap-tap 12 hearts bago lumipad mga yan, babi!</p>
  <div id="arena"></div><p id="sc">0 / 12</p></div>`);
  const ar=document.getElementById('arena'),sc=document.getElementById('sc');let n=0,alive=true;
  const spawn=()=>{
    if(!alive)return;
    const h=document.createElement('div');h.className='pop';h.textContent=['💖','💗','💕','💘'][Math.floor(Math.random()*4)];
    h.style.left=(5+Math.random()*80)+'%';h.style.top=(180+Math.random()*100)+'px';
    h.onclick=e=>{h.remove();n++;sc.textContent=n+' / 12';burst(e.clientX,e.clientY,'✨');if(n>=12&&alive){alive=false;next()}};
    ar.appendChild(h);setTimeout(()=>h.remove(),3000);setTimeout(spawn,450);
  };spawn();
}

/* 4 scramble */
function g4(){
  const w=SECRET_WORD.toUpperCase();let pool=w.split('').map((c,i)=>({c,i})).sort(()=>Math.random()-.5);let ans=[];
  const draw=()=>{
    $(`<div class="fade">${bar()}<h2>Unscramble It</h2><p>I promise to make you&hellip; (unscramble it)</p>
    <div class="tiles">${w.split('').map((_,i)=>`<div class="tile slot">${ans[i]?ans[i].c:''}</div>`).join('')}</div>
    <div class="tiles">${pool.map(t=>`<div class="tile" data-i="${t.i}">${t.c}</div>`).join('')}</div>
    <button class="btn" id="rs">Reset</button></div>`);
    document.querySelectorAll('.tile:not(.slot)').forEach(el=>el.onclick=()=>{
      const t=pool.find(p=>p.i==el.dataset.i);pool=pool.filter(p=>p!==t);ans.push(t);
      if(ans.length===w.length){
        if(ans.map(a=>a.c).join('')===w){draw();document.querySelectorAll('.slot').forEach(s=>s.style.animation='beat .8s');burst(innerWidth/2,innerHeight/2,'🌸');next();return}
        pool=ans.sort(()=>Math.random()-.5);ans=[];
      }
      draw();
    });
    document.getElementById('rs').onclick=()=>{pool=[...pool,...ans];ans=[];draw()};
  };draw();
}

/* 5 flower melody */
function g5(){
  const em=['🌸','🌷','🌹','💮'];
  $(`<div class="fade">${bar()}<h2>Flower Melody</h2><p id="ms">Watch the flowers bloom carefully, my babi!</p>
  <div class="pads">${em.map((e,i)=>`<div class="pad" data-i="${i}">${e}</div>`).join('')}</div><p class="small" id="rd"></p></div>`);
  const pads=[...document.querySelectorAll('.pad')],ms=document.getElementById('ms'),rd=document.getElementById('rd');
  let seq=[],pos=0,input=false;
  const light=i=>{pads[i].classList.add('lit');setTimeout(()=>pads[i].classList.remove('lit'),350)};
  const play=()=>{
    input=false;pos=0;seq.push(Math.floor(Math.random()*4));
    rd.textContent=`Round ${seq.length} of 4`;ms.textContent='Watch the flowers bloom…';
    seq.forEach((v,k)=>setTimeout(()=>light(v),800+k*650));
    setTimeout(()=>{input=true;ms.textContent='Your turn, Babi 🌸'},800+seq.length*650);
  };
  pads.forEach(pd=>pd.onclick=e=>{
    if(!input)return;const i=+pd.dataset.i;light(i);
    if(i===seq[pos]){
      pos++;burst(e.clientX,e.clientY,'🌸',3);
      if(pos===seq.length){
        input=false;
        if(seq.length===4){ms.textContent='Beautiful 💖';next()}
        else{ms.textContent='Yay! Isa pa nga ';setTimeout(play,1000)}
      }
    }else{input=false;ms.textContent='Oops, let\'s start ulit, babi! 🥹';seq=[];setTimeout(play,1300)}
  });
  play();
}

/* 6 find the heart */
function g6(){
  $(`<div class="fade">${bar()}<h2>Find the Heart</h2><p id="ms">Watch where the heart hides, baby!</p>
  <div class="cups">${[0,1,2].map(i=>`<div class="cup" style="left:${i*33.3}%"><div class="hh"></div><div class="lid">?</div></div>`).join('')}</div></div>`);
  const cups=[...document.querySelectorAll('.cup')],ms=document.getElementById('ms');
  let slot=[0,1,2],target=0,can=false;
  const place=()=>cups.forEach((c,i)=>c.style.left=slot[i]*33.3+'%');
  const round=()=>{
    can=false;cups.forEach(c=>{c.classList.remove('up');c.querySelector('.hh').textContent=''});
    target=Math.floor(Math.random()*3);cups[target].querySelector('.hh').textContent='💗';
    ms.textContent='Watch where the heart hides…';
    setTimeout(()=>cups[target].classList.add('up'),400);
    setTimeout(()=>cups[target].classList.remove('up'),1700);
    for(let k=0;k<7;k++)setTimeout(()=>{
      const a=Math.floor(Math.random()*3),b=(a+1+Math.floor(Math.random()*2))%3;
      [slot[a],slot[b]]=[slot[b],slot[a]];place();
    },2200+k*550);
    setTimeout(()=>{can=true;ms.textContent='Oh nasaan na, Babi? 💗'},2200+7*550);
  };
  cups.forEach((c,i)=>c.onclick=e=>{
    if(!can)return;can=false;c.classList.add('up');
    if(i===target){ms.textContent='Wow! Ang galing naman ng babi ko na yan! 💖';burst(e.clientX,e.clientY);next()}
    else{ms.textContent='Oops, not there 🥹 try again';setTimeout(()=>cups[target].classList.add('up'),500);setTimeout(round,1900)}
  });
  place();round();
}

/* 7 scratch card */
function g7(){
  $(`<div class="fade">${bar()}<h2>Scratch Me</h2><p>Scratch the card to reveal a secret 💌</p>
  <div class="scr"><div class="under">I love you more<br>than yesterday, babi! 💗<small>(mahal na mahal kita palagi!)</small></div><canvas id="cv" width="300" height="160"></canvas></div>
  <p class="small" id="pg">Scratch lang, babi...</p></div>`);
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  const gr=ctx.createLinearGradient(0,0,300,160);gr.addColorStop(0,'#ffc2da');gr.addColorStop(1,'#ff7eb3');
  ctx.fillStyle=gr;ctx.fillRect(0,0,300,160);
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='800 22px Nunito,sans-serif';ctx.textAlign='center';ctx.fillText('scratch here ✨',150,88);
  let down=false,done=false,cnt=0;
  const xy=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*160/r.height]};
  const check=()=>{
    const d=ctx.getImageData(0,0,300,160).data;let c=0,t=0;
    for(let i=3;i<d.length;i+=64){t++;if(d[i]<20)c++}
    const pc=c/t;document.getElementById('pg').textContent=Math.floor(Math.min(100,pc/.55*100))+'%';
    if(pc>.55&&!done){done=true;cv.style.opacity=0;burst(innerWidth/2,innerHeight/2,'💗');setTimeout(next,2200)}
  };
  cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);dot(e)});
  const dot=e=>{
    if(!down||done)return;const[x,y]=xy(e);
    ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,20,0,7);ctx.fill();
    if(++cnt%6===0)check();
  };
  cv.addEventListener('pointermove',dot);
  cv.addEventListener('pointerup',()=>{down=false;check()});
}

/* 8 quiz */
function g8(){
  let i=0;
  const show=()=>{
    const q=QUIZ[i];
    $(`<div class="fade">${bar()}<h2>Love Quiz</h2><p>${q.q}</p><div class="opts">${q.a.map((a,k)=>`<button class="opt" data-k="${k}">${a}</button>`).join('')}</div><p class="note" id="nt"></p><p class="small">${i+1} of ${QUIZ.length}</p></div>`);
    const nt=document.getElementById('nt');let busy=false;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=e=>{
      if(busy)return;
      if(+b.dataset.k===q.c){busy=true;b.classList.add('ok');nt.textContent=q.ok;burst(e.clientX,e.clientY);for(let k=0;k<4;k++)setTimeout(()=>burst(innerWidth/2,innerHeight/2,'💖'),k*120);setTimeout(()=>{i++;i<QUIZ.length?show():next()},1800)}
      else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');nt.textContent=q.no}
    });
  };show();
}

/* letter */
function letter(){
  stage=total-1;
  $(`<div class="fade">${bar()}
  <h2>You did it, Babi! 🎉</h2><p>One last thing… <b>press and hold</b> mo yung heart para ma-open mo yung letter, ganda! 💌</p>
  <div class="env" id="env"><div class="body"></div><div class="flap"></div><div class="seal" id="seal"><span>💗</span></div></div>
  <p class="small" id="hp">Hold the heart…</p><div id="lt"></div></div>`);
  const env=document.getElementById('env'),seal=document.getElementById('seal'),hp=document.getElementById('hp');
  let p=0,holding=false,opened=false;
  const open=()=>{
    env.classList.remove('hold');env.classList.add('open');hp.textContent='💗';
    for(let k=0;k<8;k++)setTimeout(()=>burst(innerWidth/2,innerHeight/3,k%2?'🌸':'💗'),k*150);
    setTimeout(()=>{
      env.style.display='none';hp.style.display='none';
      document.getElementById('lt').innerHTML='<div class="letter" id="txt"></div>';
      const el=document.getElementById('txt');let n=0;
      const t=setInterval(()=>{el.textContent=LETTER.slice(0,++n);el.scrollTop=el.scrollHeight;if(n>=LETTER.length)clearInterval(t)},30);
      el.onclick=()=>{clearInterval(t);n=LETTER.length;el.textContent=LETTER};
    },900);
  };
  const loop=setInterval(()=>{
    if(opened)return;
    p=holding?Math.min(100,p+1.4):Math.max(0,p-3);
    seal.style.setProperty('--p',p);
    hp.textContent=p>0?(p<100?'Hold mo lang… '+Math.floor(p)+'% 💗':'💗'):'Hold the heart…';
    if(holding&&Math.random()<.35){const r=seal.getBoundingClientRect();burst(r.left+39,r.top+39,'💗',1)}
    if(p>=100){opened=true;clearInterval(loop);open()}
  },40);
  const dn=e=>{e.preventDefault();holding=true;env.classList.add('hold')};
  const up=()=>{holding=false;env.classList.remove('hold')};
  seal.addEventListener('pointerdown',dn);
  seal.addEventListener('contextmenu',e=>e.preventDefault());
  addEventListener('pointerup',up);addEventListener('pointercancel',up);
}

const games=[g1,g2,g3,g4,g5,g6,g7,g8,letter];
</script>
